<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Saudagar Sagu Meranti — Game Simulasi Bisnis</title>
<link rel="stylesheet" href="css/style.css?v=7">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
<div id="game">
  <!-- HEADER HUD -->
  <header id="hud">
    <div class="profil">
      <div class="avatar">🧑‍🌾</div>
      <div class="profil-info">
        <b>Saudagar Sagu</b>
        <span>Lv <b id="level">1</b> • <span id="expPersen">0%</span></span>
        <div class="expbar"><div id="expBar"></div></div>
      </div>
    </div>
    <div class="hud-tengah">
      <div class="hud-chip">📅 Hari <b id="hari">1</b> <span id="tanggal"></span></div>
      <div class="hud-chip">🕐 <b id="jam">06:00</b></div>
      <div class="hud-chip"><b id="cuaca">☀️ Cerah</b> • <span id="musim">Musim Panen</span></div>
      <div class="hud-chip target-chip" title="Target bisnis"><span id="target"></span><div class="targetbar"><div id="targetBar"></div></div></div>
    </div>
    <div class="hud-kanan">
      <div class="hud-chip uang">💰 <b id="uang">Rp0</b></div>
      <div class="hud-chip">💎 <b id="permata">0</b></div>
      <div class="hud-chip">⭐ <b id="reputasi">0</b></div>
      <button class="hud-btn" id="tombolSuara" onclick="toggleSuara()" title="Suara">🔊</button>
      <button class="hud-btn" onclick="bukaPanel('misi')" title="Notifikasi &amp; kabar">🔔</button>
      <button class="hud-btn" onclick="resetGame()" title="Mulai ulang">⚙️</button>
    </div>
  </header>

  <!-- AREA UTAMA -->
  <main id="panggung">
    <div id="dunia3d"></div>
    <div id="toast"></div>

    <!-- SIDEBAR KIRI -->
    <nav id="sidebar">
      <button onclick="bukaPanel('misi')" title="Misi &amp; Kabar">🎯<span>Misi</span></button>
      <button onclick="bukaPanel('kontrak')" title="Kontrak Ekspor">📜<span>Kontrak</span></button>
      <button onclick="bukaPanel('pekerja')" title="Pekerja">👷<span>Pekerja</span></button>
      <button onclick="bukaPanel('upgrade')" title="Upgrade">⬆️<span>Upgrade</span></button>
      <button onclick="bukaPanel('inventaris')" title="Inventaris">📦<span>Inventaris</span></button>
    </nav>

    <!-- PANEL MENGAMBANG -->
    <div id="panel" class="tersembunyi">
      <div class="panel-kepala">
        <b id="panelJudul">Panel</b>
        <button onclick="tutupPanel()" title="Tutup">✕</button>
      </div>
      <div id="panelIsi"></div>
    </div>

    <!-- TOMBOL HARI BERIKUTNYA -->
    <button id="tombolHari" onclick="hariBerikutnya()">➡️ Hari Berikutnya</button>
    <div id="menang" style="display:none">🏆 Kamu sudah menjadi Saudagar Sagu Meranti!</div>
  </main>

  <!-- NAV BAWAH -->
  <nav id="navbawah">
    <button onclick="fokusBangunan('kebun')">🌴<span>Kebun</span></button>
    <button onclick="fokusBangunan('kilang')">🏭<span>Kilang</span></button>
    <button onclick="fokusBangunan('pasar')">🛒<span>Pasar</span></button>
    <button onclick="fokusBangunan('pelabuhan')">🚢<span>Ekspor</span></button>
    <button onclick="fokusBangunan('kedai')">☕<span>Kedai Kopi</span></button>
    <button onclick="bukaPanel('produksi')">🍜<span>Produksi</span></button>
  </nav>
</div>
<script src="js/game.js?v=7"></script>
</body>
</html>
